{% load static %}
<div class="articles-list-container">
    {% for article in articles_list %}
        <div class="article-box-container">
            <div>
                <a href="{% url 'articles:article' article.slug %}" class="link">
                    {% if article.cover %}
                        <img src="{% static article.cover.name|cut:'articles/static/' %}" alt="{{ article.title }}" class="article-box-img base-img">
                    {% else %}
                        <img src="https://placehold.co/800x100" alt="No images available" class="article-box-img base-img">
                    {% endif %}
                </a>
            </div>
            <a href="{% url 'articles:article' article.slug %}" class="center link">
                <h2 class="box-title bold">
                    {{ article.title }}
                </h2>
            </a>
            <h3 class="box-description">
                {{ article.description }}
            </h3>
            <div class="container">
                <img src="https://placehold.co/600x400" alt="{{ article.redactor }}" class="circle-img">
                <p class="box-author">{{ article.redactor }}</p>
            </div>
        </div>
    {% endfor %}
</div>
